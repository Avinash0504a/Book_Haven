<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Maa Ooru Katha">
  <title>Back cover of Maa Ooru Katha</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c6170"/><stop offset="1" stop-color="#092f39"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#fb8b24" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#fb8b24" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#fb8b24">“A village, its secrets and</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#fb8b24">the family at the centre of</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#fb8b24">them.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#fb8b24" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#fb8b24"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#fb8b24">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">Kavya Reddy is a Telugu novelist and</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">playwright whose work moves between</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">village life and the city stage. Her</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">dialogue is sharp and her characters</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">stubbornly alive. She has seen several</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">of her plays performed in regional</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">theatres.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#fb8b24" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#fb8b24"/>
  <rect x="192" y="386" width="1" height="30" fill="#092f39"/><rect x="194" y="386" width="3" height="30" fill="#092f39"/><rect x="199" y="386" width="1" height="30" fill="#092f39"/><rect x="202" y="386" width="3" height="30" fill="#092f39"/><rect x="206" y="386" width="2" height="30" fill="#092f39"/><rect x="209" y="386" width="3" height="30" fill="#092f39"/><rect x="213" y="386" width="2" height="30" fill="#092f39"/><rect x="217" y="386" width="3" height="30" fill="#092f39"/><rect x="222" y="386" width="1" height="30" fill="#092f39"/><rect x="225" y="386" width="2" height="30" fill="#092f39"/><rect x="228" y="386" width="3" height="30" fill="#092f39"/><rect x="233" y="386" width="3" height="30" fill="#092f39"/><rect x="238" y="386" width="2" height="30" fill="#092f39"/><rect x="242" y="386" width="1" height="30" fill="#092f39"/><rect x="244" y="386" width="1" height="30" fill="#092f39"/><rect x="247" y="386" width="1" height="30" fill="#092f39"/><rect x="249" y="386" width="3" height="30" fill="#092f39"/><rect x="253" y="386" width="2" height="30" fill="#092f39"/><rect x="256" y="386" width="3" height="30" fill="#092f39"/><rect x="261" y="386" width="2" height="30" fill="#092f39"/>
</svg>
