<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of The Merchant of Muziris">
  <title>Back cover of The Merchant of Muziris</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#72443a"/><stop offset="1" stop-color="#3b1a13"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#f9e2b8" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#f9e2b8" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9e2b8">“A pepper trader, a Roman</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9e2b8">ship and a harbour at the</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9e2b8">edge of the world.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#f9e2b8" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#f9e2b8"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#f9e2b8">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">Vikram Rao is a historian and</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">storyteller of trade routes, ports and</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">the people who travelled them. He</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">turns archive records into vivid</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">narrative and loves a good map. His</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">books make long centuries feel like a</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">conversation over tea.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#f9e2b8" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#f9e2b8"/>
  <rect x="192" y="386" width="1" height="30" fill="#3b1a13"/><rect x="194" y="386" width="3" height="30" fill="#3b1a13"/><rect x="198" y="386" width="2" height="30" fill="#3b1a13"/><rect x="201" y="386" width="3" height="30" fill="#3b1a13"/><rect x="206" y="386" width="3" height="30" fill="#3b1a13"/><rect x="211" y="386" width="1" height="30" fill="#3b1a13"/><rect x="214" y="386" width="1" height="30" fill="#3b1a13"/><rect x="216" y="386" width="3" height="30" fill="#3b1a13"/><rect x="221" y="386" width="3" height="30" fill="#3b1a13"/><rect x="226" y="386" width="1" height="30" fill="#3b1a13"/><rect x="228" y="386" width="2" height="30" fill="#3b1a13"/><rect x="232" y="386" width="3" height="30" fill="#3b1a13"/><rect x="236" y="386" width="3" height="30" fill="#3b1a13"/><rect x="241" y="386" width="1" height="30" fill="#3b1a13"/><rect x="244" y="386" width="3" height="30" fill="#3b1a13"/><rect x="249" y="386" width="2" height="30" fill="#3b1a13"/><rect x="252" y="386" width="2" height="30" fill="#3b1a13"/><rect x="256" y="386" width="1" height="30" fill="#3b1a13"/><rect x="258" y="386" width="3" height="30" fill="#3b1a13"/>
</svg>
