<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of The Glass Colony">
  <title>Back cover of The Glass Colony</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#533a72"/><stop offset="1" stop-color="#25133b"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#f5b7d4" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#f5b7d4" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f5b7d4">“Life under a dome on Mars,</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f5b7d4">and the rumour that the sky</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f5b7d4">is a lie.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#f5b7d4" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#f5b7d4"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#f5b7d4">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">Laura Mitchell writes science fiction</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">inspired by space exploration and the</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">people who make it happen. She grew up</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">reading mission logs as bedtime</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">stories and brings that wonder to her</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">fiction. Her novels balance big ideas</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">with very human crews.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#f5b7d4" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#f5b7d4"/>
  <rect x="192" y="386" width="3" height="30" fill="#25133b"/><rect x="197" y="386" width="3" height="30" fill="#25133b"/><rect x="201" y="386" width="1" height="30" fill="#25133b"/><rect x="204" y="386" width="2" height="30" fill="#25133b"/><rect x="208" y="386" width="2" height="30" fill="#25133b"/><rect x="212" y="386" width="1" height="30" fill="#25133b"/><rect x="214" y="386" width="1" height="30" fill="#25133b"/><rect x="216" y="386" width="2" height="30" fill="#25133b"/><rect x="219" y="386" width="2" height="30" fill="#25133b"/><rect x="223" y="386" width="3" height="30" fill="#25133b"/><rect x="227" y="386" width="2" height="30" fill="#25133b"/><rect x="230" y="386" width="3" height="30" fill="#25133b"/><rect x="235" y="386" width="1" height="30" fill="#25133b"/><rect x="238" y="386" width="3" height="30" fill="#25133b"/><rect x="242" y="386" width="2" height="30" fill="#25133b"/><rect x="245" y="386" width="3" height="30" fill="#25133b"/><rect x="250" y="386" width="3" height="30" fill="#25133b"/><rect x="254" y="386" width="1" height="30" fill="#25133b"/><rect x="257" y="386" width="1" height="30" fill="#25133b"/><rect x="259" y="386" width="2" height="30" fill="#25133b"/>
</svg>
