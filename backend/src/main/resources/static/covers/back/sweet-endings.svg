<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Sweet Endings">
  <title>Back cover of Sweet Endings</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#72443a"/><stop offset="1" stop-color="#3b1a13"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#f9e2b8" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#f9e2b8" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9e2b8">“Festival sweets and</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9e2b8">everyday puddings, with</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9e2b8">step-by-step notes.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#f9e2b8" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#f9e2b8"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#f9e2b8">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">Meera Krishnan is a food writer who</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">collects recipes and the stories</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">behind them. She has cooked in family</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">kitchens across the country and writes</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">about meals as memory. Her books are</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">as likely to be read in an armchair as</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">at the stove.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#f9e2b8" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#f9e2b8"/>
  <rect x="192" y="386" width="2" height="30" fill="#3b1a13"/><rect x="195" y="386" width="3" height="30" fill="#3b1a13"/><rect x="199" y="386" width="2" height="30" fill="#3b1a13"/><rect x="203" y="386" width="1" height="30" fill="#3b1a13"/><rect x="205" y="386" width="1" height="30" fill="#3b1a13"/><rect x="207" y="386" width="1" height="30" fill="#3b1a13"/><rect x="209" y="386" width="1" height="30" fill="#3b1a13"/><rect x="211" y="386" width="1" height="30" fill="#3b1a13"/><rect x="214" y="386" width="3" height="30" fill="#3b1a13"/><rect x="219" y="386" width="3" height="30" fill="#3b1a13"/><rect x="223" y="386" width="3" height="30" fill="#3b1a13"/><rect x="227" y="386" width="1" height="30" fill="#3b1a13"/><rect x="229" y="386" width="1" height="30" fill="#3b1a13"/><rect x="231" y="386" width="1" height="30" fill="#3b1a13"/><rect x="234" y="386" width="2" height="30" fill="#3b1a13"/><rect x="238" y="386" width="2" height="30" fill="#3b1a13"/><rect x="242" y="386" width="1" height="30" fill="#3b1a13"/><rect x="244" y="386" width="2" height="30" fill="#3b1a13"/><rect x="247" y="386" width="2" height="30" fill="#3b1a13"/><rect x="251" y="386" width="3" height="30" fill="#3b1a13"/><rect x="255" y="386" width="1" height="30" fill="#3b1a13"/><rect x="258" y="386" width="3" height="30" fill="#3b1a13"/>
</svg>
