<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Kadal Kathai">
  <title>Back cover of Kadal Kathai</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#306846"/><stop offset="1" stop-color="#0c331c"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#fde68a" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#fde68a" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#fde68a">“Bedtime tales from the sea,</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#fde68a">narrated for young</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#fde68a">listeners.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#fde68a" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#fde68a"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#fde68a">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">Lakshmi Narayan is a Tamil poet,</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">storyteller and teacher. Her work</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">draws on village folktales and the</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">rhythms of classical verse. She has</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">guided generations of students to love</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">their mother tongue.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#fde68a" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#fde68a"/>
  <rect x="192" y="386" width="3" height="30" fill="#0c331c"/><rect x="197" y="386" width="2" height="30" fill="#0c331c"/><rect x="200" y="386" width="1" height="30" fill="#0c331c"/><rect x="202" y="386" width="2" height="30" fill="#0c331c"/><rect x="206" y="386" width="3" height="30" fill="#0c331c"/><rect x="210" y="386" width="3" height="30" fill="#0c331c"/><rect x="215" y="386" width="1" height="30" fill="#0c331c"/><rect x="218" y="386" width="3" height="30" fill="#0c331c"/><rect x="223" y="386" width="3" height="30" fill="#0c331c"/><rect x="228" y="386" width="3" height="30" fill="#0c331c"/><rect x="233" y="386" width="1" height="30" fill="#0c331c"/><rect x="235" y="386" width="2" height="30" fill="#0c331c"/><rect x="238" y="386" width="3" height="30" fill="#0c331c"/><rect x="243" y="386" width="1" height="30" fill="#0c331c"/><rect x="245" y="386" width="3" height="30" fill="#0c331c"/><rect x="249" y="386" width="1" height="30" fill="#0c331c"/><rect x="252" y="386" width="2" height="30" fill="#0c331c"/><rect x="255" y="386" width="3" height="30" fill="#0c331c"/><rect x="260" y="386" width="2" height="30" fill="#0c331c"/>
</svg>
