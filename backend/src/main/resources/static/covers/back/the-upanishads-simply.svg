<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of The Upanishads, Simply">
  <title>Back cover of The Upanishads, Simply</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#603a52"/><stop offset="1" stop-color="#2e1324"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#9be7c4" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#9be7c4" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#9be7c4">“Core ideas of the</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#9be7c4">Upanishads in plain,</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#9be7c4">readable prose.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#9be7c4" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#9be7c4"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#9be7c4">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">Sanjay Kulkarni retells classic epics</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">for new readers, keeping the grandeur</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">and dropping the dust. A lifelong</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">student of Sanskrit and storytelling,</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">he writes in clean, modern prose. His</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">retellings are popular with families</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">who read aloud.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#9be7c4" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#9be7c4"/>
  <rect x="192" y="386" width="3" height="30" fill="#2e1324"/><rect x="197" y="386" width="2" height="30" fill="#2e1324"/><rect x="201" y="386" width="2" height="30" fill="#2e1324"/><rect x="204" y="386" width="2" height="30" fill="#2e1324"/><rect x="208" y="386" width="2" height="30" fill="#2e1324"/><rect x="212" y="386" width="2" height="30" fill="#2e1324"/><rect x="215" y="386" width="2" height="30" fill="#2e1324"/><rect x="218" y="386" width="2" height="30" fill="#2e1324"/><rect x="221" y="386" width="1" height="30" fill="#2e1324"/><rect x="224" y="386" width="1" height="30" fill="#2e1324"/><rect x="227" y="386" width="3" height="30" fill="#2e1324"/><rect x="232" y="386" width="1" height="30" fill="#2e1324"/><rect x="235" y="386" width="3" height="30" fill="#2e1324"/><rect x="239" y="386" width="3" height="30" fill="#2e1324"/><rect x="244" y="386" width="1" height="30" fill="#2e1324"/><rect x="246" y="386" width="1" height="30" fill="#2e1324"/><rect x="249" y="386" width="2" height="30" fill="#2e1324"/><rect x="252" y="386" width="1" height="30" fill="#2e1324"/><rect x="254" y="386" width="3" height="30" fill="#2e1324"/><rect x="258" y="386" width="1" height="30" fill="#2e1324"/><rect x="261" y="386" width="1" height="30" fill="#2e1324"/>
</svg>
