<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Lives of Great Scientists">
  <title>Back cover of Lives of Great Scientists</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#533a71"/><stop offset="1" stop-color="#25133a"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#f9c5d1" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#f9c5d1" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9c5d1">“Portraits of scientists and</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9c5d1">the obstacles they</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9c5d1">overcame.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#f9c5d1" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#f9c5d1"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#f9c5d1">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">Rohan Mehta is a travel writer and</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">biographer who follows his subjects</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">across borders and decades. He is</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">known for patient research and for</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">finding the small, human detail in a</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">grand story. He writes between</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">journeys, usually on trains.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#f9c5d1" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#f9c5d1"/>
  <rect x="192" y="386" width="2" height="30" fill="#25133a"/><rect x="195" y="386" width="2" height="30" fill="#25133a"/><rect x="199" y="386" width="1" height="30" fill="#25133a"/><rect x="202" y="386" width="1" height="30" fill="#25133a"/><rect x="204" y="386" width="1" height="30" fill="#25133a"/><rect x="207" y="386" width="2" height="30" fill="#25133a"/><rect x="211" y="386" width="2" height="30" fill="#25133a"/><rect x="215" y="386" width="3" height="30" fill="#25133a"/><rect x="220" y="386" width="3" height="30" fill="#25133a"/><rect x="225" y="386" width="3" height="30" fill="#25133a"/><rect x="229" y="386" width="2" height="30" fill="#25133a"/><rect x="232" y="386" width="1" height="30" fill="#25133a"/><rect x="235" y="386" width="2" height="30" fill="#25133a"/><rect x="238" y="386" width="2" height="30" fill="#25133a"/><rect x="241" y="386" width="2" height="30" fill="#25133a"/><rect x="245" y="386" width="1" height="30" fill="#25133a"/><rect x="247" y="386" width="2" height="30" fill="#25133a"/><rect x="251" y="386" width="1" height="30" fill="#25133a"/><rect x="253" y="386" width="1" height="30" fill="#25133a"/><rect x="255" y="386" width="3" height="30" fill="#25133a"/><rect x="259" y="386" width="2" height="30" fill="#25133a"/><rect x="263" y="386" width="1" height="30" fill="#25133a"/>
</svg>
