<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of The Masala Dabba">
  <title>Back cover of The Masala Dabba</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c6152"/><stop offset="1" stop-color="#092f24"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#ffd166" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#ffd166" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#ffd166">“Twenty spices, one steel</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#ffd166">box and a hundred weeknight</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#ffd166">dishes.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#ffd166" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#ffd166"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#ffd166">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">Meera Krishnan is a food writer who</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">collects recipes and the stories</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">behind them. She has cooked in family</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">kitchens across the country and writes</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">about meals as memory. Her books are</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">as likely to be read in an armchair as</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">at the stove.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#ffd166" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#ffd166"/>
  <rect x="192" y="386" width="1" height="30" fill="#092f24"/><rect x="195" y="386" width="3" height="30" fill="#092f24"/><rect x="199" y="386" width="2" height="30" fill="#092f24"/><rect x="203" y="386" width="2" height="30" fill="#092f24"/><rect x="207" y="386" width="1" height="30" fill="#092f24"/><rect x="209" y="386" width="1" height="30" fill="#092f24"/><rect x="212" y="386" width="2" height="30" fill="#092f24"/><rect x="216" y="386" width="3" height="30" fill="#092f24"/><rect x="220" y="386" width="3" height="30" fill="#092f24"/><rect x="225" y="386" width="1" height="30" fill="#092f24"/><rect x="227" y="386" width="3" height="30" fill="#092f24"/><rect x="232" y="386" width="1" height="30" fill="#092f24"/><rect x="234" y="386" width="1" height="30" fill="#092f24"/><rect x="236" y="386" width="1" height="30" fill="#092f24"/><rect x="239" y="386" width="3" height="30" fill="#092f24"/><rect x="243" y="386" width="3" height="30" fill="#092f24"/><rect x="248" y="386" width="3" height="30" fill="#092f24"/><rect x="253" y="386" width="2" height="30" fill="#092f24"/><rect x="257" y="386" width="3" height="30" fill="#092f24"/><rect x="262" y="386" width="2" height="30" fill="#092f24"/>
</svg>
