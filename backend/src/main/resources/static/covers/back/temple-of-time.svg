<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Temple of Time">
  <title>Back cover of Temple of Time</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#533a71"/><stop offset="1" stop-color="#25133a"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#f9c5d1" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#f9c5d1" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9c5d1">“The story of a temple city</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9c5d1">and the families who built</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9c5d1">it.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#f9c5d1" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#f9c5d1"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#f9c5d1">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">Ananya Iyer writes on history, ideas</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">and everyday philosophy for readers</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">who do not own a philosophy degree.</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">She holds that big questions belong at</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">the dinner table. Her essays are</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">curious, funny and always kind to the</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">reader.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#f9c5d1" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#f9c5d1"/>
  <rect x="192" y="386" width="3" height="30" fill="#25133a"/><rect x="197" y="386" width="3" height="30" fill="#25133a"/><rect x="201" y="386" width="1" height="30" fill="#25133a"/><rect x="203" y="386" width="2" height="30" fill="#25133a"/><rect x="206" y="386" width="2" height="30" fill="#25133a"/><rect x="209" y="386" width="1" height="30" fill="#25133a"/><rect x="211" y="386" width="1" height="30" fill="#25133a"/><rect x="213" y="386" width="2" height="30" fill="#25133a"/><rect x="217" y="386" width="1" height="30" fill="#25133a"/><rect x="220" y="386" width="1" height="30" fill="#25133a"/><rect x="222" y="386" width="3" height="30" fill="#25133a"/><rect x="226" y="386" width="3" height="30" fill="#25133a"/><rect x="231" y="386" width="1" height="30" fill="#25133a"/><rect x="233" y="386" width="3" height="30" fill="#25133a"/><rect x="237" y="386" width="1" height="30" fill="#25133a"/><rect x="240" y="386" width="2" height="30" fill="#25133a"/><rect x="243" y="386" width="1" height="30" fill="#25133a"/><rect x="245" y="386" width="2" height="30" fill="#25133a"/><rect x="248" y="386" width="3" height="30" fill="#25133a"/><rect x="253" y="386" width="2" height="30" fill="#25133a"/><rect x="257" y="386" width="2" height="30" fill="#25133a"/><rect x="260" y="386" width="3" height="30" fill="#25133a"/>
</svg>
