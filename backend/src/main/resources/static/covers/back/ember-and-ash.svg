<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Ember and Ash">
  <title>Back cover of Ember and Ash</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#306846"/><stop offset="1" stop-color="#0c331c"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#fde68a" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#fde68a" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#fde68a">“A war of fire and shadow,</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#fde68a">performed by a full cast.”</text>
  <path d="M82 118 H138 M162 118 H218" stroke="#fde68a" stroke-width="1.5"/>
  <path d="M150 112 l6 6 l-6 6 l-6 -6z" fill="#fde68a"/>
  <text x="150" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#fde68a">ABOUT THE AUTHOR</text>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">Oliver Grant is a fantasy author of</text>
  <text x="150" y="183" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">long, layered series with carefully</text>
  <text x="150" y="198" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">built worlds. He draws his own maps</text>
  <text x="150" y="213" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">and keeps a notebook of invented</text>
  <text x="150" y="228" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">histories. His novels reward readers</text>
  <text x="150" y="243" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">who like to notice a detail early and</text>
  <text x="150" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fde68a" fill-opacity=".85">see it matter much later.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#fde68a" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#fde68a"/>
  <rect x="192" y="386" width="3" height="30" fill="#0c331c"/><rect x="196" y="386" width="1" height="30" fill="#0c331c"/><rect x="199" y="386" width="2" height="30" fill="#0c331c"/><rect x="203" y="386" width="3" height="30" fill="#0c331c"/><rect x="207" y="386" width="1" height="30" fill="#0c331c"/><rect x="210" y="386" width="1" height="30" fill="#0c331c"/><rect x="213" y="386" width="3" height="30" fill="#0c331c"/><rect x="218" y="386" width="2" height="30" fill="#0c331c"/><rect x="221" y="386" width="2" height="30" fill="#0c331c"/><rect x="225" y="386" width="2" height="30" fill="#0c331c"/><rect x="228" y="386" width="3" height="30" fill="#0c331c"/><rect x="233" y="386" width="2" height="30" fill="#0c331c"/><rect x="236" y="386" width="2" height="30" fill="#0c331c"/><rect x="239" y="386" width="1" height="30" fill="#0c331c"/><rect x="242" y="386" width="2" height="30" fill="#0c331c"/><rect x="245" y="386" width="1" height="30" fill="#0c331c"/><rect x="248" y="386" width="2" height="30" fill="#0c331c"/><rect x="251" y="386" width="2" height="30" fill="#0c331c"/><rect x="255" y="386" width="1" height="30" fill="#0c331c"/><rect x="257" y="386" width="2" height="30" fill="#0c331c"/><rect x="260" y="386" width="2" height="30" fill="#0c331c"/><rect x="263" y="386" width="1" height="30" fill="#0c331c"/>
</svg>
