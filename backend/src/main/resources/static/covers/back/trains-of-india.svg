<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Trains of India">
  <title>Back cover of Trains of India</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#533a72"/><stop offset="1" stop-color="#25133b"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#f5b7d4" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#f5b7d4" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f5b7d4">“Ten great rail journeys and</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f5b7d4">the people who ride them</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f5b7d4">every day.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#f5b7d4" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#f5b7d4"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#f5b7d4">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">Vikram Rao is a historian and</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">storyteller of trade routes, ports and</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">the people who travelled them. He</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">turns archive records into vivid</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">narrative and loves a good map. His</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">books make long centuries feel like a</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f5b7d4" fill-opacity=".85">conversation over tea.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#f5b7d4" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#f5b7d4"/>
  <rect x="192" y="386" width="3" height="30" fill="#25133b"/><rect x="196" y="386" width="3" height="30" fill="#25133b"/><rect x="200" y="386" width="2" height="30" fill="#25133b"/><rect x="203" y="386" width="3" height="30" fill="#25133b"/><rect x="207" y="386" width="3" height="30" fill="#25133b"/><rect x="211" y="386" width="1" height="30" fill="#25133b"/><rect x="214" y="386" width="2" height="30" fill="#25133b"/><rect x="218" y="386" width="3" height="30" fill="#25133b"/><rect x="223" y="386" width="1" height="30" fill="#25133b"/><rect x="225" y="386" width="3" height="30" fill="#25133b"/><rect x="229" y="386" width="3" height="30" fill="#25133b"/><rect x="233" y="386" width="1" height="30" fill="#25133b"/><rect x="236" y="386" width="2" height="30" fill="#25133b"/><rect x="240" y="386" width="1" height="30" fill="#25133b"/><rect x="243" y="386" width="1" height="30" fill="#25133b"/><rect x="245" y="386" width="3" height="30" fill="#25133b"/><rect x="249" y="386" width="2" height="30" fill="#25133b"/><rect x="253" y="386" width="3" height="30" fill="#25133b"/><rect x="257" y="386" width="2" height="30" fill="#25133b"/><rect x="261" y="386" width="1" height="30" fill="#25133b"/>
</svg>
