<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of The Lost Kitten">
  <title>Back cover of The Lost Kitten</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a5272"/><stop offset="1" stop-color="#13243b"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#f4d35e" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#f4d35e" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f4d35e">“A heartwarming tale of</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f4d35e">courage, friendship and</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f4d35e">feline adventure.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#f4d35e" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#f4d35e"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#f4d35e">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">Emily Parker is a children's author of</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">animal adventures full of friendship</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">and mischief. A former primary school</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">librarian, she tests every story out</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">loud on a live audience of</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">seven-year-olds. Her books are made</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">for bedtime and for reading twice.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#f4d35e" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#f4d35e"/>
  <rect x="192" y="386" width="3" height="30" fill="#13243b"/><rect x="196" y="386" width="2" height="30" fill="#13243b"/><rect x="199" y="386" width="2" height="30" fill="#13243b"/><rect x="202" y="386" width="3" height="30" fill="#13243b"/><rect x="206" y="386" width="2" height="30" fill="#13243b"/><rect x="209" y="386" width="2" height="30" fill="#13243b"/><rect x="213" y="386" width="1" height="30" fill="#13243b"/><rect x="216" y="386" width="3" height="30" fill="#13243b"/><rect x="221" y="386" width="1" height="30" fill="#13243b"/><rect x="223" y="386" width="1" height="30" fill="#13243b"/><rect x="226" y="386" width="1" height="30" fill="#13243b"/><rect x="228" y="386" width="1" height="30" fill="#13243b"/><rect x="231" y="386" width="2" height="30" fill="#13243b"/><rect x="234" y="386" width="1" height="30" fill="#13243b"/><rect x="237" y="386" width="1" height="30" fill="#13243b"/><rect x="240" y="386" width="2" height="30" fill="#13243b"/><rect x="244" y="386" width="3" height="30" fill="#13243b"/><rect x="248" y="386" width="3" height="30" fill="#13243b"/><rect x="252" y="386" width="1" height="30" fill="#13243b"/><rect x="255" y="386" width="3" height="30" fill="#13243b"/><rect x="259" y="386" width="3" height="30" fill="#13243b"/>
</svg>
