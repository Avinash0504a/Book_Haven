<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Graphic City">
  <title>Back cover of Graphic City</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c6170"/><stop offset="1" stop-color="#092f39"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#fb8b24" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#fb8b24" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#fb8b24">“A graphic novel of a city</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#fb8b24">that redraws itself every</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#fb8b24">night.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#fb8b24" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#fb8b24"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#fb8b24">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">Daniel Brooks writes young adult</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">fiction and graphic stories about</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">growing up, friendship and finding</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">your voice. He draws on his own</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">awkward teenage years for material.</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">His books are fast, funny and honest</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#fb8b24" fill-opacity=".85">about how hard being young can be.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#fb8b24" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#fb8b24"/>
  <rect x="192" y="386" width="3" height="30" fill="#092f39"/><rect x="196" y="386" width="1" height="30" fill="#092f39"/><rect x="199" y="386" width="3" height="30" fill="#092f39"/><rect x="204" y="386" width="3" height="30" fill="#092f39"/><rect x="209" y="386" width="3" height="30" fill="#092f39"/><rect x="214" y="386" width="3" height="30" fill="#092f39"/><rect x="218" y="386" width="2" height="30" fill="#092f39"/><rect x="221" y="386" width="1" height="30" fill="#092f39"/><rect x="223" y="386" width="1" height="30" fill="#092f39"/><rect x="225" y="386" width="3" height="30" fill="#092f39"/><rect x="230" y="386" width="1" height="30" fill="#092f39"/><rect x="232" y="386" width="1" height="30" fill="#092f39"/><rect x="234" y="386" width="3" height="30" fill="#092f39"/><rect x="238" y="386" width="1" height="30" fill="#092f39"/><rect x="241" y="386" width="2" height="30" fill="#092f39"/><rect x="245" y="386" width="3" height="30" fill="#092f39"/><rect x="250" y="386" width="3" height="30" fill="#092f39"/><rect x="255" y="386" width="1" height="30" fill="#092f39"/><rect x="257" y="386" width="1" height="30" fill="#092f39"/><rect x="260" y="386" width="2" height="30" fill="#092f39"/>
</svg>
