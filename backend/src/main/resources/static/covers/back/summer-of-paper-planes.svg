<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Summer of Paper Planes">
  <title>Back cover of Summer of Paper Planes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#603a52"/><stop offset="1" stop-color="#2e1324"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#9be7c4" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#9be7c4" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#9be7c4">“Two rivals, one rooftop and</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#9be7c4">a contest that changes</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#9be7c4">everything.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#9be7c4" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#9be7c4"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#9be7c4">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">Daniel Brooks writes young adult</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">fiction and graphic stories about</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">growing up, friendship and finding</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">your voice. He draws on his own</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">awkward teenage years for material.</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">His books are fast, funny and honest</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9be7c4" fill-opacity=".85">about how hard being young can be.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#9be7c4" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#9be7c4"/>
  <rect x="192" y="386" width="2" height="30" fill="#2e1324"/><rect x="196" y="386" width="1" height="30" fill="#2e1324"/><rect x="198" y="386" width="1" height="30" fill="#2e1324"/><rect x="200" y="386" width="3" height="30" fill="#2e1324"/><rect x="204" y="386" width="1" height="30" fill="#2e1324"/><rect x="206" y="386" width="1" height="30" fill="#2e1324"/><rect x="209" y="386" width="1" height="30" fill="#2e1324"/><rect x="211" y="386" width="2" height="30" fill="#2e1324"/><rect x="215" y="386" width="2" height="30" fill="#2e1324"/><rect x="219" y="386" width="1" height="30" fill="#2e1324"/><rect x="222" y="386" width="3" height="30" fill="#2e1324"/><rect x="227" y="386" width="1" height="30" fill="#2e1324"/><rect x="230" y="386" width="2" height="30" fill="#2e1324"/><rect x="233" y="386" width="3" height="30" fill="#2e1324"/><rect x="238" y="386" width="1" height="30" fill="#2e1324"/><rect x="241" y="386" width="3" height="30" fill="#2e1324"/><rect x="245" y="386" width="2" height="30" fill="#2e1324"/><rect x="249" y="386" width="1" height="30" fill="#2e1324"/><rect x="252" y="386" width="1" height="30" fill="#2e1324"/><rect x="255" y="386" width="2" height="30" fill="#2e1324"/><rect x="258" y="386" width="2" height="30" fill="#2e1324"/>
</svg>
