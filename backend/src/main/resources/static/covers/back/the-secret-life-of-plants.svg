<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of The Secret Life of Plants">
  <title>Back cover of The Secret Life of Plants</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#72443a"/><stop offset="1" stop-color="#3b1a13"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#f9e2b8" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#f9e2b8" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9e2b8">“How trees talk, flowers</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9e2b8">keep time and roots make</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9e2b8">decisions.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#f9e2b8" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#f9e2b8"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#f9e2b8">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">Sarah Collins writes accessible</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">science and personal essays that begin</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">with a small observation and end</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">somewhere surprising. A trained</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">biologist, she brings field notes to</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">the page. Her readers praise her</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9e2b8" fill-opacity=".85">patience and her sense of humour.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#f9e2b8" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#f9e2b8"/>
  <rect x="192" y="386" width="2" height="30" fill="#3b1a13"/><rect x="196" y="386" width="3" height="30" fill="#3b1a13"/><rect x="201" y="386" width="3" height="30" fill="#3b1a13"/><rect x="206" y="386" width="1" height="30" fill="#3b1a13"/><rect x="209" y="386" width="3" height="30" fill="#3b1a13"/><rect x="213" y="386" width="2" height="30" fill="#3b1a13"/><rect x="217" y="386" width="1" height="30" fill="#3b1a13"/><rect x="220" y="386" width="3" height="30" fill="#3b1a13"/><rect x="225" y="386" width="2" height="30" fill="#3b1a13"/><rect x="228" y="386" width="2" height="30" fill="#3b1a13"/><rect x="232" y="386" width="3" height="30" fill="#3b1a13"/><rect x="236" y="386" width="2" height="30" fill="#3b1a13"/><rect x="239" y="386" width="1" height="30" fill="#3b1a13"/><rect x="241" y="386" width="2" height="30" fill="#3b1a13"/><rect x="245" y="386" width="3" height="30" fill="#3b1a13"/><rect x="250" y="386" width="1" height="30" fill="#3b1a13"/><rect x="252" y="386" width="2" height="30" fill="#3b1a13"/><rect x="256" y="386" width="2" height="30" fill="#3b1a13"/><rect x="259" y="386" width="1" height="30" fill="#3b1a13"/><rect x="261" y="386" width="1" height="30" fill="#3b1a13"/>
</svg>
