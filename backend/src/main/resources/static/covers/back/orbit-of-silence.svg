<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Orbit of Silence">
  <title>Back cover of Orbit of Silence</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a5272"/><stop offset="1" stop-color="#13243b"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#f4d35e" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#f4d35e" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f4d35e">“A lone engineer, a silent</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f4d35e">station and a signal that</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f4d35e">should not exist.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#f4d35e" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#f4d35e"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#f4d35e">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">Nikhil Sharma writes quiet,</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">claustrophobic science fiction set on</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">lonely stations and long voyages. A</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">former engineer, he is fascinated by</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">what isolation does to people and</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">machines. His stories reward patient</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4d35e" fill-opacity=".85">readers with a slow, memorable chill.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#f4d35e" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#f4d35e"/>
  <rect x="192" y="386" width="1" height="30" fill="#13243b"/><rect x="195" y="386" width="2" height="30" fill="#13243b"/><rect x="198" y="386" width="2" height="30" fill="#13243b"/><rect x="201" y="386" width="1" height="30" fill="#13243b"/><rect x="204" y="386" width="3" height="30" fill="#13243b"/><rect x="209" y="386" width="2" height="30" fill="#13243b"/><rect x="212" y="386" width="1" height="30" fill="#13243b"/><rect x="214" y="386" width="3" height="30" fill="#13243b"/><rect x="218" y="386" width="2" height="30" fill="#13243b"/><rect x="222" y="386" width="1" height="30" fill="#13243b"/><rect x="224" y="386" width="3" height="30" fill="#13243b"/><rect x="229" y="386" width="3" height="30" fill="#13243b"/><rect x="234" y="386" width="3" height="30" fill="#13243b"/><rect x="239" y="386" width="2" height="30" fill="#13243b"/><rect x="243" y="386" width="2" height="30" fill="#13243b"/><rect x="247" y="386" width="2" height="30" fill="#13243b"/><rect x="251" y="386" width="1" height="30" fill="#13243b"/><rect x="253" y="386" width="3" height="30" fill="#13243b"/><rect x="257" y="386" width="2" height="30" fill="#13243b"/><rect x="260" y="386" width="2" height="30" fill="#13243b"/>
</svg>
