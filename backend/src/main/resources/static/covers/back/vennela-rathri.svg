<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Vennela Rathri">
  <title>Back cover of Vennela Rathri</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#533a71"/><stop offset="1" stop-color="#25133a"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#f9c5d1" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#f9c5d1" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9c5d1">“A moonlit romance set in a</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f9c5d1">quiet coastal town.”</text>
  <path d="M82 118 H138 M162 118 H218" stroke="#f9c5d1" stroke-width="1.5"/>
  <path d="M150 112 l6 6 l-6 6 l-6 -6z" fill="#f9c5d1"/>
  <text x="150" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#f9c5d1">ABOUT THE AUTHOR</text>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">Kavya Reddy is a Telugu novelist and</text>
  <text x="150" y="183" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">playwright whose work moves between</text>
  <text x="150" y="198" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">village life and the city stage. Her</text>
  <text x="150" y="213" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">dialogue is sharp and her characters</text>
  <text x="150" y="228" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">stubbornly alive. She has seen several</text>
  <text x="150" y="243" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">of her plays performed in regional</text>
  <text x="150" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f9c5d1" fill-opacity=".85">theatres.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#f9c5d1" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#f9c5d1"/>
  <rect x="192" y="386" width="3" height="30" fill="#25133a"/><rect x="196" y="386" width="3" height="30" fill="#25133a"/><rect x="200" y="386" width="1" height="30" fill="#25133a"/><rect x="202" y="386" width="1" height="30" fill="#25133a"/><rect x="204" y="386" width="3" height="30" fill="#25133a"/><rect x="209" y="386" width="3" height="30" fill="#25133a"/><rect x="214" y="386" width="2" height="30" fill="#25133a"/><rect x="217" y="386" width="1" height="30" fill="#25133a"/><rect x="219" y="386" width="2" height="30" fill="#25133a"/><rect x="222" y="386" width="1" height="30" fill="#25133a"/><rect x="225" y="386" width="3" height="30" fill="#25133a"/><rect x="229" y="386" width="2" height="30" fill="#25133a"/><rect x="233" y="386" width="2" height="30" fill="#25133a"/><rect x="237" y="386" width="2" height="30" fill="#25133a"/><rect x="240" y="386" width="1" height="30" fill="#25133a"/><rect x="243" y="386" width="2" height="30" fill="#25133a"/><rect x="247" y="386" width="2" height="30" fill="#25133a"/><rect x="251" y="386" width="2" height="30" fill="#25133a"/><rect x="255" y="386" width="1" height="30" fill="#25133a"/><rect x="257" y="386" width="3" height="30" fill="#25133a"/><rect x="261" y="386" width="3" height="30" fill="#25133a"/>
</svg>
