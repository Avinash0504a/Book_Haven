<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Gita Saar">
  <title>Back cover of Gita Saar</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d523a"/><stop offset="1" stop-color="#162413"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#f4e285" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#f4e285" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f4e285">“The essence of the Gita,</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f4e285">narrated chapter by chapter</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f4e285">in Hindi.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#f4e285" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#f4e285"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#f4e285">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4e285" fill-opacity=".85">Sanjay Kulkarni retells classic epics</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4e285" fill-opacity=".85">for new readers, keeping the grandeur</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4e285" fill-opacity=".85">and dropping the dust. A lifelong</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4e285" fill-opacity=".85">student of Sanskrit and storytelling,</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4e285" fill-opacity=".85">he writes in clean, modern prose. His</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4e285" fill-opacity=".85">retellings are popular with families</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f4e285" fill-opacity=".85">who read aloud.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#f4e285" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#f4e285"/>
  <rect x="192" y="386" width="3" height="30" fill="#162413"/><rect x="196" y="386" width="3" height="30" fill="#162413"/><rect x="201" y="386" width="3" height="30" fill="#162413"/><rect x="205" y="386" width="2" height="30" fill="#162413"/><rect x="208" y="386" width="1" height="30" fill="#162413"/><rect x="210" y="386" width="3" height="30" fill="#162413"/><rect x="214" y="386" width="3" height="30" fill="#162413"/><rect x="218" y="386" width="1" height="30" fill="#162413"/><rect x="221" y="386" width="2" height="30" fill="#162413"/><rect x="225" y="386" width="2" height="30" fill="#162413"/><rect x="228" y="386" width="3" height="30" fill="#162413"/><rect x="232" y="386" width="3" height="30" fill="#162413"/><rect x="236" y="386" width="3" height="30" fill="#162413"/><rect x="240" y="386" width="2" height="30" fill="#162413"/><rect x="244" y="386" width="2" height="30" fill="#162413"/><rect x="247" y="386" width="2" height="30" fill="#162413"/><rect x="251" y="386" width="3" height="30" fill="#162413"/><rect x="255" y="386" width="2" height="30" fill="#162413"/><rect x="259" y="386" width="1" height="30" fill="#162413"/><rect x="262" y="386" width="1" height="30" fill="#162413"/>
</svg>
