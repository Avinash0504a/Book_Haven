<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of Learn Tamil by Listening">
  <title>Back cover of Learn Tamil by Listening</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a3a44"/><stop offset="1" stop-color="#4c131b"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#f6e7cb" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#f6e7cb" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f6e7cb">“Everyday Tamil taught</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f6e7cb">through short spoken</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#f6e7cb">lessons.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#f6e7cb" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#f6e7cb"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#f6e7cb">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f6e7cb" fill-opacity=".85">Lakshmi Narayan is a Tamil poet,</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f6e7cb" fill-opacity=".85">storyteller and teacher. Her work</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f6e7cb" fill-opacity=".85">draws on village folktales and the</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f6e7cb" fill-opacity=".85">rhythms of classical verse. She has</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f6e7cb" fill-opacity=".85">guided generations of students to love</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#f6e7cb" fill-opacity=".85">their mother tongue.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#f6e7cb" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#f6e7cb"/>
  <rect x="192" y="386" width="3" height="30" fill="#4c131b"/><rect x="197" y="386" width="3" height="30" fill="#4c131b"/><rect x="202" y="386" width="3" height="30" fill="#4c131b"/><rect x="206" y="386" width="3" height="30" fill="#4c131b"/><rect x="211" y="386" width="2" height="30" fill="#4c131b"/><rect x="215" y="386" width="2" height="30" fill="#4c131b"/><rect x="218" y="386" width="3" height="30" fill="#4c131b"/><rect x="223" y="386" width="3" height="30" fill="#4c131b"/><rect x="228" y="386" width="1" height="30" fill="#4c131b"/><rect x="230" y="386" width="1" height="30" fill="#4c131b"/><rect x="232" y="386" width="1" height="30" fill="#4c131b"/><rect x="235" y="386" width="2" height="30" fill="#4c131b"/><rect x="238" y="386" width="2" height="30" fill="#4c131b"/><rect x="241" y="386" width="3" height="30" fill="#4c131b"/><rect x="245" y="386" width="2" height="30" fill="#4c131b"/><rect x="249" y="386" width="2" height="30" fill="#4c131b"/><rect x="253" y="386" width="1" height="30" fill="#4c131b"/><rect x="256" y="386" width="3" height="30" fill="#4c131b"/><rect x="261" y="386" width="1" height="30" fill="#4c131b"/>
</svg>
