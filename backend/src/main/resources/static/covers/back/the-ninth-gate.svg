<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="Back cover of The Ninth Gate">
  <title>Back cover of The Ninth Gate</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c6152"/><stop offset="1" stop-color="#092f24"/></linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="12" y="12" width="276" height="426" fill="none" stroke="#ffd166" stroke-width="1.6"/>
  <rect x="18" y="18" width="264" height="414" fill="none" stroke="#ffd166" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#ffd166">“Eight gates have fallen. A</text>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#ffd166">reluctant mapmaker must find</text>
  <text x="150" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#ffd166">the ninth.”</text>
  <path d="M82 140 H138 M162 140 H218" stroke="#ffd166" stroke-width="1.5"/>
  <path d="M150 134 l6 6 l-6 6 l-6 -6z" fill="#ffd166"/>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#ffd166">ABOUT THE AUTHOR</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">Oliver Grant is a fantasy author of</text>
  <text x="150" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">long, layered series with carefully</text>
  <text x="150" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">built worlds. He draws his own maps</text>
  <text x="150" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">and keeps a notebook of invented</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">histories. His novels reward readers</text>
  <text x="150" y="265" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">who like to notice a detail early and</text>
  <text x="150" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#ffd166" fill-opacity=".85">see it matter much later.</text>
  <text x="34" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1.5" fill="#ffd166" fill-opacity=".8">BOOK HAVEN</text>
  <rect x="186" y="380" width="84" height="42" fill="#ffd166"/>
  <rect x="192" y="386" width="3" height="30" fill="#092f24"/><rect x="196" y="386" width="1" height="30" fill="#092f24"/><rect x="198" y="386" width="2" height="30" fill="#092f24"/><rect x="202" y="386" width="1" height="30" fill="#092f24"/><rect x="205" y="386" width="3" height="30" fill="#092f24"/><rect x="209" y="386" width="3" height="30" fill="#092f24"/><rect x="213" y="386" width="1" height="30" fill="#092f24"/><rect x="215" y="386" width="1" height="30" fill="#092f24"/><rect x="217" y="386" width="2" height="30" fill="#092f24"/><rect x="220" y="386" width="3" height="30" fill="#092f24"/><rect x="225" y="386" width="1" height="30" fill="#092f24"/><rect x="227" y="386" width="1" height="30" fill="#092f24"/><rect x="230" y="386" width="2" height="30" fill="#092f24"/><rect x="234" y="386" width="1" height="30" fill="#092f24"/><rect x="236" y="386" width="2" height="30" fill="#092f24"/><rect x="240" y="386" width="3" height="30" fill="#092f24"/><rect x="244" y="386" width="1" height="30" fill="#092f24"/><rect x="247" y="386" width="3" height="30" fill="#092f24"/><rect x="252" y="386" width="2" height="30" fill="#092f24"/><rect x="256" y="386" width="3" height="30" fill="#092f24"/><rect x="261" y="386" width="2" height="30" fill="#092f24"/>
</svg>
