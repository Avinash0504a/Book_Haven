  <rect x="14" y="14" width="272" height="422" fill="none" stroke="#ff9f43" stroke-width="2"/>
  <text x="150" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#ff9f43">THE MOON</text>
