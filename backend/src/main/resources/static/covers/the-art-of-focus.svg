  <!--art-->
  <g id="art" transform="translate(150 262) scale(1.531) translate(-4 2)" color="#f4d35e" stroke="currentColor" fill="none" stroke-width="1.83" stroke-linecap="round" stroke-linejoin="round"><circle r="44"/><circle r="30"/><circle r="16" fill="currentColor" fill-opacity=".25"/><circle r="5" fill="currentColor" stroke="none"/><path d="M0 0 L46 -42"/><path d="M46 -42 l-12 2 M46 -42 l-2 12 M52 -48 l-8 2 M52 -48 l-2 8"/></g>
