<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" role="img" aria-label="The Art of Focus by Arjun Patel">
  <title>The Art of Focus by Arjun Patel</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a5272"/><stop offset="1" stop-color="#13243b"/></linearGradient>
    <radialGradient id="glow" cx="150" cy="262" r="140" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4d35e" stop-opacity=".32"/><stop offset=".6" stop-color="#f4d35e" stop-opacity=".08"/><stop offset="1" stop-color="#f4d35e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>
