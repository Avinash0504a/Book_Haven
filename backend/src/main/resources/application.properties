spring.application.name=book-haven

# Network: loopback only (security policy section 3)
server.address=127.0.0.1
server.port=5000

# Database. These five values have NO default; StartupValidator stops the application when one is missing.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.jwt.secret=${APP_JWT_SECRET}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# No default in-memory user; authentication is JWT only
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# JWT lifetime: 60 minutes (decision H5), no refresh token
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# Structured JSON logs, 90-day retention (security policy section 8)
logging.structured.format.console=logstash
logging.structured.format.file=logstash
logging.file.name=logs/book-haven.log
logging.logback.rollingpolicy.max-history=90

# Orders and fulfilment (research D6)
app.orders.expiry-minutes=15
app.fulfilment.processing-offset-hours=2
app.fulfilment.shipped-offset-hours=6
app.fulfilment.delivered-day-offset=1
app.fulfilment.delivered-time=15:00

# Delivery date rule (research D4); time zone is Asia/Kolkata
app.delivery.cutoff-hour=14
app.delivery.handling-days=1
app.delivery.metro-transit-days=2
app.delivery.other-transit-days=4
app.delivery.metro-prefixes=110,400,411,500,560,600,700,380
app.delivery.default-pincode=110001

# Shipping (data-model business rules)
app.shipping.free-threshold=500
app.shipping.flat-charge=49
