name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # PostgreSQL comes from the runner's own package, not a public container image
      # (security policy section 2). The role password is generated here and masked.
      - name: Start PostgreSQL for integration tests
        run: |
          DB_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$DB_PASSWORD"
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE bookhaven LOGIN PASSWORD '$DB_PASSWORD';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE books_test OWNER bookhaven;"
          echo "SPRING_DATASOURCE_USERNAME=bookhaven" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "TEST_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/books_test" >> "$GITHUB_ENV"

      - name: Backend tests (unit, integration, contract)
        working-directory: backend
        run: mvn -q -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ hashFiles('frontend/package.json') != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, check, test, build
        working-directory: frontend
        run: |
          npm ci
          npm run check:tokens
          npm run lint
          npm test
          npm run build

  secrets-scan:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Look for committed secrets
        shell: pwsh
        run: ./scripts/check-secrets.ps1

  # SAST (security policy section 11)
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Build for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: mvn -q -B -DskipTests -DskipITs package
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # Dependency scan (security policy section 7). A finding at CVSS 7.0 or higher fails the job.
  # Mend needs an organisation token; OWASP Dependency-Check and CodeQL stand in until it exists.
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: OWASP Dependency-Check (Maven)
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -q -B org.owasp:dependency-check-maven:13.0.0:check
          -DfailBuildOnCVSS=7.0
          -DnvdApiKey="$NVD_API_KEY"
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        with:
          node-version: '22'
      - name: npm audit
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm audit --audit-level=high
